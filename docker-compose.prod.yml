# Single-VM deployment. See docs/DEPLOY.md.
#   fill in .env (see the VM section of .env.example)
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
x-app: &app
  image: milo-ai-app:latest
  build: { context: ., dockerfile: Dockerfile }
  env_file: .env
  environment:
    DATABASE_URL: postgres://milo:${POSTGRES_PASSWORD}@postgres:5432/milo
    STORAGE_PROVIDER: local
  volumes: ["appdata:/data"]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: milo, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: milo }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U milo"], interval: 5s, retries: 20 }
    restart: unless-stopped

  # Runs once per deploy, then exits. web and worker wait for it.
  migrate:
    <<: *app
    command: ["pnpm", "--filter", "@milo/db", "exec", "tsx", "src/migrate.ts"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  web:
    <<: *app
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"], interval: 15s, timeout: 5s, retries: 5, start_period: 20s }

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@milo/worker", "exec", "tsx", "src/index.ts"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # Meeting bots. Sign the bot's Google account in once (docs/bot.md), then scale with: --scale bot=3
  bot:
    image: milo-ai-bot:latest
    build: { context: ., dockerfile: apps/bot/Dockerfile }
    depends_on: { web: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://milo:${POSTGRES_PASSWORD}@postgres:5432/milo
      WEB_URL: http://web:3000
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_VNC_PASSWORD: ${BOT_VNC_PASSWORD:-}
    shm_size: 1gb
    volumes: ["botprofile:/profile:ro", "botdata:/data"]
    restart: unless-stopped

  # HTTPS in front of web. Needs DOMAIN pointing at this machine; certificates are obtained and renewed automatically.
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data"]
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  botprofile:
  botdata:
  caddydata:
